    <ellipse cx="720" cy="512" rx="105" ry="40"/>
  </g>
  <g fill="#fef3c7" stroke="#b45309" stroke-width="1.8">
    <ellipse cx="720" cy="393" rx="105" ry="40"/>
  </g>

  <g text-anchor="middle">
    <g font-size="10" font-weight="700" fill="#6b7280">
      <text x="428" y="152">UC-01</text>
      <text x="428" y="262">UC-02</text>
      <text x="428" y="377">UC-03</text>
      <text x="428" y="492">UC-04</text>
      <text x="428" y="624">UC-05</text>
      <text x="720" y="269">UC-06</text>
      <text x="720" y="387">UC-07</text>
      <text x="720" y="499">UC-08</text>
    </g>
    <g font-size="13" font-weight="600" fill="#111827">
      <text x="428" y="170">Create Contract</text><text x="428" y="188">&amp; Fund Escrow</text>
      <text x="428" y="280">Upload Draft</text><text x="428" y="298">Deliverable</text>
      <text x="428" y="395">Review Draft</text><text x="428" y="413">&amp; Sign Off</text>
      <text x="428" y="510">Release Milestone</text><text x="428" y="528">Payment</text>
      <text x="428" y="644">Raise Dispute</text>
      <text x="720" y="289">Apply Watermark</text>
      <text x="720" y="407">Request Revision</text>
      <text x="720" y="517">Authorize Escrow</text><text x="720" y="535">Transfer</text>
    </g>
  </g>

  <!-- ================= INCLUDE / EXTEND ================= -->
  <g stroke="#374151" stroke-width="1.6" fill="none" stroke-dasharray="7,5" marker-end="url(#arrowOpen)">
    <line x1="533" y1="275" x2="612" y2="275"/>
    <line x1="529" y1="512" x2="612" y2="512"/>
    <line x1="615" y1="393" x2="533" y2="391"/>
  </g>
  <g font-size="12" font-style="italic" font-weight="600" text-anchor="middle">
    <text x="573" y="267" fill="#15803d">&#171;include&#187;</text>
    <text x="571" y="504" fill="#15803d">&#171;include&#187;</text>
    <text x="574" y="384" fill="#b45309">&#171;extend&#187;</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g>
    <rect x="40" y="640" width="228" height="120" fill="#ffffff" stroke="#9ca3af" stroke-width="1" rx="4"/>
    <text x="54" y="662" font-size="12" font-weight="700" fill="#111827">Legend</text>
    <ellipse cx="70" cy="683" rx="18" ry="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="96" y="687" font-size="11" fill="#374151">Primary use case</text>
    <ellipse cx="70" cy="708" rx="18" ry="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="96" y="712" font-size="11" fill="#374151">Included use case</text>
    <ellipse cx="70" cy="733" rx="18" ry="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="96" y="737" font-size="11" fill="#374151">Extending use case</text>
