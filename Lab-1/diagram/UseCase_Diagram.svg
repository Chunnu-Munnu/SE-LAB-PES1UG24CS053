<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="820" viewBox="0 0 1160 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowOpen" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#374151" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="820" fill="#ffffff"/>

  <!-- Title block -->
  <text x="580" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">UML Use-Case Diagram &#8212; Freelance Content Creator Escrow Platform</text>
  <text x="580" y="56" text-anchor="middle" font-size="13" fill="#4b5563">Lab 1: Requirements Engineering &amp; UML Use-Case Modelling &#183; Problem Statement #53 &#183; AMOGH SHARMA &#183; PES1UG24CS053</text>

  <!-- System boundary -->
  <rect x="300" y="80" width="560" height="640" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="580" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Freelance Content Creator Escrow Platform</text>

  <!-- ================= ACTORS ================= -->
  <g stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round">
