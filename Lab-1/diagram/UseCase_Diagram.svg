    <circle cx="160" cy="210" r="14"/><line x1="160" y1="224" x2="160" y2="266"/>
    <line x1="132" y1="238" x2="188" y2="238"/><line x1="160" y1="266" x2="138" y2="300"/><line x1="160" y1="266" x2="182" y2="300"/>
    <!-- Client Sponsor -->
    <circle cx="160" cy="470" r="14"/><line x1="160" y1="484" x2="160" y2="526"/>
    <line x1="132" y1="498" x2="188" y2="498"/><line x1="160" y1="526" x2="138" y2="560"/><line x1="160" y1="526" x2="182" y2="560"/>
    <!-- Payment Gateway -->
    <circle cx="1000" cy="480" r="14"/><line x1="1000" y1="494" x2="1000" y2="536"/>
    <line x1="972" y1="508" x2="1028" y2="508"/><line x1="1000" y1="536" x2="978" y2="570"/><line x1="1000" y1="536" x2="1022" y2="570"/>
    <!-- Platform Admin -->
    <circle cx="1000" cy="640" r="14"/><line x1="1000" y1="654" x2="1000" y2="696"/>
    <line x1="972" y1="668" x2="1028" y2="668"/><line x1="1000" y1="696" x2="978" y2="730"/><line x1="1000" y1="696" x2="1022" y2="730"/>
  </g>
  <g font-size="13" font-weight="600" fill="#111827" text-anchor="middle">
    <text x="160" y="322">Content Creator</text>
    <text x="160" y="582">Client Sponsor</text>
    <text x="1000" y="592">Payment Gateway</text>
    <text x="1000" y="752">Platform Admin</text>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">
    <text x="1000" y="608">&#171;external system&#187;</text>
  </g>

  <!-- ================= ASSOCIATIONS ================= -->
  <g stroke="#374151" stroke-width="1.6" fill="none">
    <!-- Content Creator -->
    <line x1="190" y1="230" x2="330" y2="172"/>
    <line x1="192" y1="248" x2="323" y2="268"/>
    <line x1="180" y1="292" x2="336" y2="612"/>
    <!-- Client Sponsor -->
    <line x1="182" y1="452" x2="336" y2="188"/>
    <line x1="192" y1="490" x2="325" y2="392"/>
    <line x1="192" y1="506" x2="325" y2="500"/>
    <line x1="186" y1="548" x2="334" y2="624"/>
    <!-- Payment Gateway -->
    <line x1="970" y1="500" x2="828" y2="512"/>
    <!-- Platform Admin -->
    <line x1="968" y1="660" x2="536" y2="642"/>
  </g>

  <!-- ================= USE CASES ================= -->
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8">
    <ellipse cx="428" cy="165" rx="105" ry="40"/>
    <ellipse cx="428" cy="275" rx="105" ry="40"/>
    <ellipse cx="428" cy="390" rx="105" ry="40"/>
    <ellipse cx="428" cy="505" rx="105" ry="40"/>
    <ellipse cx="428" cy="630" rx="105" ry="40"/>
  </g>
  <g fill="#dcfce7" stroke="#15803d" stroke-width="1.8">
